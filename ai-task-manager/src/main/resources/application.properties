spring.application.name=ai-task-manager

# 云平台会注入 PORT（如 Render）；本地默认 8080
server.port=${PORT:8080}

# 开发期关闭 Thymeleaf 模板缓存：修改 HTML 后刷新即可生效，无需每次重启应用。
# 上线前可改回 true 以获得更好性能。
spring.thymeleaf.cache=false

# DeepSeek API 基础地址：OpenAI 兼容接口，Day 4 接入使用。
deepseek.api-url=https://api.deepseek.com/chat/completions

# DeepSeek API Key：从环境变量读取，避免把密钥写进代码或 Git。
# Windows PowerShell 临时设置示例：$env:DEEPSEEK_API_KEY="你的key"
deepseek.api-key=${DEEPSEEK_API_KEY:}

# DeepSeek 模型名称：先使用通用对话模型，后续可按需要切换。
deepseek.model=deepseek-chat