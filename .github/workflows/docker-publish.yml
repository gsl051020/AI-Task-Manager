# 推送到 main 时构建 Docker 镜像到 GHCR，供 Sealos 等「只拉镜像」平台使用
name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./ai-task-manager
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-task-manager:latest
            ghcr.io/${{ github.repository_owner }}/ai-task-manager:${{ github.sha }}
